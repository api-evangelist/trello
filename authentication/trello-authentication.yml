api_key:
  issuance: https://trello.com/apps/admin
  note: >-
    An API key is tied to a Power-Up. Trello states the key may be public but the user token
    must never be, and that a key with no allowed origins configured will have every redirect
    blocked.
  allowed_origins:
    required: true
    wildcards: true
    note: >-
      Allowed origins constrain where Trello will redirect after consent, preventing a third
      party from reusing your key and redirecting users elsewhere.
oauth1:
  supported: true
  request_token_url: https://trello.com/1/OAuthGetRequestToken
  authorize_url: https://trello.com/1/OAuthAuthorizeToken
  access_token_url: https://trello.com/1/OAuthGetAccessToken
revocation:
  user_surface: https://trello.com/u/{username}/account
  api: DELETE /1/tokens/{token}
  on_revoked_status: 401
  on_revoked_body: invalid token
