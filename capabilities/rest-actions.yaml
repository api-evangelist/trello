        description: Get the Member of an Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: actions-id-memberCreator
      path: /actions/{id}/memberCreator
      operations:
      - name: getactionmembercreator
        method: GET
        description: Get the Member Creator of an Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
