      path: /actions/{id}
      operations:
      - name: getaction
        method: GET
        description: Get an Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateaction
        method: PUT
        description: Update an Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: text
          in: query
          type: string
          description: The new text for the comment action.
          required: true
      - name: deleteaction
        method: DELETE
        description: Delete an Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: actions-id-board
      path: /actions/{id}/board
      operations:
      - name: getactionboard
        method: GET
        description: Get the Board for an Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
