naftiko: 1.0.0-alpha2
info:
  label: Trello REST API — Actions
  description: 'Trello REST API — Actions. 12 operations. Lead operation: Get an Action. Self-contained Naftiko capability
    covering one Trello business surface.'
  tags:
  - Trello
  - Actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
