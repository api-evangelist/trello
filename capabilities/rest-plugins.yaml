naftiko: 1.0.0-alpha2
info:
  label: Trello REST API — Plugins
  description: 'Trello REST API — Plugins. 3 operations. Lead operation: Get a Plugin. Self-contained Naftiko capability covering
    one Trello business surface.'
  tags:
  - Trello
  - Plugins
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRELLO_API_KEY: TRELLO_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-plugins
    baseUri: https://api.trello.com/1
    description: Trello REST API — Plugins business capability. Self-contained, no shared references.
    resources:
    - name: plugins-id
      path: /plugins/{id}
      operations:
      - name: getplugin
        method: GET
        description: Get a Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateplugin
        method: PUT
        description: Update a Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: plugins-id-listings
      path: /plugins/{id}/listings
      operations:
      - name: createpluginlisting
        method: POST
        description: Create a Listing for a Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: key
      value: '{{env.TRELLO_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: rest-plugins-rest
    port: 8080
    description: REST adapter for Trello REST API — Plugins. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/plugins/{id}
      name: plugins-id
      description: REST surface for plugins-id.
      operations:
      - method: GET
        name: getplugin
        description: Get a Plugin
        call: rest-plugins.getplugin
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateplugin
        description: Update a Plugin
        call: rest-plugins.updateplugin
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/plugins/{id}/listings
      name: plugins-id-listings
      description: REST surface for plugins-id-listings.
      operations:
      - method: POST
        name: createpluginlisting
        description: Create a Listing for a Plugin
        call: rest-plugins.createpluginlisting
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-plugins-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trello REST API — Plugins. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-plugin
      description: Get a Plugin
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-plugins.getplugin
      outputParameters:
      - type: object
        mapping: $.
    - name: update-plugin
      description: Update a Plugin
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-plugins.updateplugin
      outputParameters:
      - type: object
        mapping: $.
    - name: create-listing-plugin
      description: Create a Listing for a Plugin
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-plugins.createpluginlisting
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
