naftiko: 1.0.0-alpha2
info:
  label: Trello REST API — Labels
  description: 'Trello REST API — Labels. 4 operations. Lead operation: Create a Label. Self-contained Naftiko capability
    covering one Trello business surface.'
  tags:
  - Trello
  - Labels
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRELLO_API_KEY: TRELLO_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-labels
    baseUri: https://api.trello.com/1
    description: Trello REST API — Labels business capability. Self-contained, no shared references.
    resources:
    - name: labels
      path: /labels
      operations:
      - name: createlabel
        method: POST
        description: Create a Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: The name for the label.
          required: true
        - name: color
          in: query
          type: string
          description: The color for the label.
          required: true
        - name: idBoard
          in: query
          type: string
          description: The ID of the board the label belongs to.
          required: true
    - name: labels-id
      path: /labels/{id}
      operations:
      - name: getlabel
        method: GET
        description: Get a Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatelabel
        method: PUT
        description: Update a Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: The new name for the label.
        - name: color
          in: query
          type: string
          description: The new color for the label.
      - name: deletelabel
        method: DELETE
        description: Delete a Label
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: key
      value: '{{env.TRELLO_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: rest-labels-rest
    port: 8080
    description: REST adapter for Trello REST API — Labels. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/labels
      name: labels
      description: REST surface for labels.
      operations:
      - method: POST
        name: createlabel
        description: Create a Label
        call: rest-labels.createlabel
        with:
          name: rest.name
          color: rest.color
          idBoard: rest.idBoard
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/labels/{id}
      name: labels-id
      description: REST surface for labels-id.
      operations:
      - method: GET
        name: getlabel
        description: Get a Label
        call: rest-labels.getlabel
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatelabel
        description: Update a Label
        call: rest-labels.updatelabel
        with:
          name: rest.name
          color: rest.color
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletelabel
        description: Delete a Label
        call: rest-labels.deletelabel
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-labels-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trello REST API — Labels. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-label
      description: Create a Label
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-labels.createlabel
      with:
        name: tools.name
        color: tools.color
        idBoard: tools.idBoard
      outputParameters:
      - type: object
        mapping: $.
    - name: get-label
      description: Get a Label
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-labels.getlabel
      outputParameters:
      - type: object
        mapping: $.
    - name: update-label
      description: Update a Label
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-labels.updatelabel
      with:
        name: tools.name
        color: tools.color
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-label
      description: Delete a Label
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-labels.deletelabel
      outputParameters:
      - type: object
        mapping: $.
