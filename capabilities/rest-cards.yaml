naftiko: 1.0.0-alpha2
info:
  label: Trello REST API — Cards
  description: 'Trello REST API — Cards. 16 operations. Lead operation: Create a Card. Self-contained Naftiko capability covering
    one Trello business surface.'
  tags:
  - Trello
  - Cards
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRELLO_API_KEY: TRELLO_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-cards
    baseUri: https://api.trello.com/1
    description: Trello REST API — Cards business capability. Self-contained, no shared references.
    resources:
    - name: cards
      path: /cards
      operations:
      - name: createcard
        method: POST
        description: Create a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: The name for the card.
        - name: desc
          in: query
          type: string
          description: The description for the card.
        - name: pos
          in: query
          type: string
          description: The position of the card in the list.
        - name: due
          in: query
          type: string
          description: The due date for the card.
        - name: start
          in: query
          type: string
          description: The start date for the card.
        - name: dueComplete
          in: query
          type: boolean
          description: Whether the due date is complete.
        - name: idList
          in: query
          type: string
          description: The ID of the list the card should be created in.
          required: true
        - name: idMembers
          in: query
          type: string
          description: Comma-separated list of member IDs to add to the card.
        - name: idLabels
          in: query
          type: string
          description: Comma-separated list of label IDs to add to the card.
        - name: urlSource
          in: query
          type: string
          description: A URL to attach to the card.
        - name: idCardSource
          in: query
          type: string
          description: The ID of a card to copy into the new card.
    - name: cards-id
      path: /cards/{id}
      operations:
      - name: getcard
        method: GET
        description: Get a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: A comma-separated list of card fields to return.
        - name: actions
          in: query
          type: string
          description: A comma-separated list of action types to include.
        - name: attachments
          in: query
          type: string
          description: Whether to include attachments.
        - name: members
          in: query
          type: boolean
          description: Whether to include members.
        - name: checkItemStates
          in: query
          type: boolean
          description: Whether to include check item states.
        - name: checklists
          in: query
          type: string
          description: Whether to include checklists.
      - name: updatecard
        method: PUT
        description: Update a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: The new name for the card.
        - name: desc
          in: query
          type: string
          description: The new description for the card.
        - name: closed
          in: query
          type: boolean
          description: Whether the card is archived.
        - name: idMembers
          in: query
          type: string
          description: Comma-separated list of member IDs.
        - name: idLabels
          in: query
          type: string
          description: Comma-separated list of label IDs.
        - name: idList
          in: query
          type: string
          description: The ID of the list to move the card to.
        - name: idBoard
          in: query
          type: string
          description: The ID of the board to move the card to.
        - name: pos
          in: query
          type: string
          description: The new position of the card.
        - name: due
          in: query
          type: string
          description: The new due date for the card.
        - name: start
          in: query
          type: string
          description: The start date for the card.
        - name: dueComplete
          in: query
          type: boolean
          description: Whether the due date is complete.
        - name: subscribed
          in: query
          type: boolean
          description: Whether the authenticated member is subscribed to the card.
        - name: cover
          in: query
          type: string
          description: JSON string for the card cover.
      - name: deletecard
        method: DELETE
        description: Delete a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cards-id-actions
      path: /cards/{id}/actions
      operations:
      - name: getcardactions
        method: GET
        description: Get Actions on a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: A comma-separated list of action types to filter by.
    - name: cards-id-actions-comments
      path: /cards/{id}/actions/comments
      operations:
      - name: createcardcomment
        method: POST
        description: Add a Comment to a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: text
          in: query
          type: string
          description: The comment text.
          required: true
    - name: cards-id-attachments
      path: /cards/{id}/attachments
      operations:
      - name: getcardattachments
        method: GET
        description: Get Attachments on a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: A comma-separated list of attachment fields to return.
      - name: createcardattachment
        method: POST
        description: Create an Attachment on a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: The name for the attachment.
        - name: mimeType
          in: query
          type: string
          description: The MIME type of the attachment.
        - name: url
          in: query
          type: string
          description: A URL to attach to the card.
    - name: cards-id-checklists
      path: /cards/{id}/checklists
      operations:
      - name: getcardchecklists
        method: GET
        description: Get Checklists on a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcardchecklist
        method: POST
        description: Create a Checklist on a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: The name for the checklist.
        - name: idChecklistSource
          in: query
          type: string
          description: The ID of a checklist to copy into the new checklist.
        - name: pos
          in: query
          type: string
          description: The position of the checklist on the card.
    - name: cards-id-labels
      path: /cards/{id}/labels
      operations:
      - name: addcardlabel
        method: POST
        description: Add a Label to a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: value
          in: query
          type: string
          description: The ID of the label to add.
          required: true
    - name: cards-id-labels-idLabel
      path: /cards/{id}/labels/{idLabel}
      operations:
      - name: removecardlabel
        method: DELETE
        description: Remove a Label from a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: idLabel
          in: path
          type: string
          description: The ID of the label to remove.
          required: true
    - name: cards-id-members
      path: /cards/{id}/members
      operations:
      - name: addcardmember
        method: POST
        description: Add a Member to a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: value
          in: query
          type: string
          description: The ID of the member to add.
          required: true
    - name: cards-id-members-idMember
      path: /cards/{id}/members/{idMember}
      operations:
      - name: removecardmember
        method: DELETE
        description: Remove a Member from a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: idMember
          in: path
          type: string
          description: The ID of the member to remove.
          required: true
    - name: cards-id-stickers
      path: /cards/{id}/stickers
      operations:
      - name: getcardstickers
        method: GET
        description: Get Stickers on a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addcardsticker
        method: POST
        description: Add a Sticker to a Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: image
          in: query
          type: string
          description: The sticker image identifier.
          required: true
        - name: top
          in: query
          type: number
          description: The top position of the sticker as a percentage.
          required: true
        - name: left
          in: query
          type: number
          description: The left position of the sticker as a percentage.
          required: true
        - name: zIndex
          in: query
          type: integer
          description: The z-index of the sticker.
          required: true
        - name: rotate
          in: query
          type: number
          description: The rotation of the sticker in degrees.
    authentication:
      type: apikey
      key: key
      value: '{{env.TRELLO_API_KEY}}'
      placement: query
  exposes:
