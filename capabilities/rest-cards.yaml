        call: rest-cards.createcard
        with:
          name: rest.name
          desc: rest.desc
          pos: rest.pos
          due: rest.due
          start: rest.start
          dueComplete: rest.dueComplete
          idList: rest.idList
          idMembers: rest.idMembers
          idLabels: rest.idLabels
          urlSource: rest.urlSource
          idCardSource: rest.idCardSource
        outputParameters:
        - type: object
