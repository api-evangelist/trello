naftiko: "1.0.0-alpha1"

info:
  label: "Trello REST API"
  description: >-
    The Trello REST API provides programmatic access to boards, lists, cards,
    members, labels, checklists, organizations, webhooks, and all other
    Trello resources for project management automation.
  tags:
    - Boards
    - Cards
    - Collaboration
    - Kanban
    - Project Management
    - Task Management
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRELLO_API_KEY: TRELLO_API_KEY
      TRELLO_TOKEN: TRELLO_TOKEN

capability:
  consumes:
    - type: http
      namespace: trello
      baseUri: https://api.trello.com
      description: "Trello project management REST API"
      authentication:
        type: apikey
        key: key
        value: "{{TRELLO_API_KEY}}"
        placement: query
      resources:
        - name: boards
          path: /1/boards
          description: "Trello boards"
          operations:
            - name: create-board
              method: POST
              description: "Create a Board"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  desc: "{{tools.desc}}"

        - name: board-detail
          path: /1/boards/{id}
          description: "Single Trello board"
          operations:
            - name: get-board
              method: GET
              description: "Get a Board"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Board ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-board
              method: PUT
              description: "Update a Board"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Board ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  desc: "{{tools.desc}}"
            - name: delete-board
              method: DELETE
              description: "Delete a Board"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Board ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: board-cards
          path: /1/boards/{id}/cards
          description: "Cards on a board"
          operations:
            - name: get-board-cards
              method: GET
              description: "Get Cards on a Board"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Board ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: board-lists
          path: /1/boards/{id}/lists
          description: "Lists on a board"
          operations:
            - name: get-board-lists
              method: GET
              description: "Get Lists on a Board"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Board ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: board-members
          path: /1/boards/{id}/members
          description: "Members of a board"
          operations:
            - name: get-board-members
              method: GET
              description: "Get Members of a Board"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Board ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: cards
          path: /1/cards
          description: "Trello cards"
          operations:
            - name: create-card
              method: POST
              description: "Create a new Card"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  idList: "{{tools.idList}}"
                  desc: "{{tools.desc}}"
                  due: "{{tools.due}}"

        - name: card-detail
          path: /1/cards/{id}
          description: "Single Trello card"
          operations:
            - name: get-card
              method: GET
              description: "Get a Card"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Card ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-card
              method: PUT
              description: "Update a Card"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Card ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  desc: "{{tools.desc}}"
                  due: "{{tools.due}}"
                  closed: "{{tools.closed}}"
                  idList: "{{tools.idList}}"
            - name: delete-card
              method: DELETE
              description: "Delete a Card"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Card ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: lists
          path: /1/lists
          description: "Trello lists"
          operations:
            - name: create-list
              method: POST
              description: "Create a new List"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  idBoard: "{{tools.idBoard}}"

        - name: list-detail
          path: /1/lists/{id}
          description: "Single Trello list"
          operations:
            - name: get-list
              method: GET
              description: "Get a List"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "List ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-list
              method: PUT
              description: "Update a List"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "List ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  closed: "{{tools.closed}}"

        - name: list-cards
          path: /1/lists/{id}/cards
          description: "Cards in a list"
          operations:
            - name: get-list-cards
              method: GET
              description: "Get the Cards in a List"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "List ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: members
          path: /1/members/{id}
          description: "Trello member details"
          operations:
            - name: get-member
              method: GET
              description: "Get a Member"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Member ID or username"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: member-boards
          path: /1/members/{id}/boards
          description: "Boards for a member"
          operations:
            - name: get-member-boards
              method: GET
              description: "Get Member's Boards"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Member ID or username"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search
          path: /1/search
          description: "Search Trello resources"
          operations:
            - name: search
              method: GET
              description: "Search across Trello"
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: true
                  description: "Search query"
                - name: modelTypes
                  in: query
                  type: string
                  required: false
                  description: "Types to search (boards, cards, members)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: webhooks
          path: /1/webhooks
          description: "Trello webhooks"
          operations:
            - name: create-webhook
              method: POST
              description: "Create a Webhook"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  description: "{{tools.description}}"
                  callbackURL: "{{tools.callbackURL}}"
                  idModel: "{{tools.idModel}}"

        - name: webhook-detail
          path: /1/webhooks/{id}
          description: "Single webhook"
          operations:
            - name: get-webhook
              method: GET
              description: "Get a Webhook"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Webhook ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-webhook
              method: PUT
              description: "Update a Webhook"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Webhook ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  description: "{{tools.description}}"
                  callbackURL: "{{tools.callbackURL}}"
                  active: "{{tools.active}}"
            - name: delete-webhook
              method: DELETE
              description: "Delete a Webhook"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Webhook ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: trello-rest-api
      resources:
        - path: /v1/boards
          name: boards
          description: "Trello boards"
          operations:
            - method: POST
              name: create-board
              description: "Create a board"
              call: "trello.create-board"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/boards/{id}
          name: board-detail
          description: "Board detail"
          operations:
            - method: GET
              name: get-board
              description: "Get board"
              call: "trello.get-board"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: update-board
              description: "Update board"
              call: "trello.update-board"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-board
              description: "Delete board"
              call: "trello.delete-board"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/boards/{id}/cards
          name: board-cards
          description: "Cards on a board"
          operations:
            - method: GET
              name: get-board-cards
              description: "Get board cards"
              call: "trello.get-board-cards"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cards
          name: cards
          description: "Trello cards"
          operations:
            - method: POST
              name: create-card
              description: "Create card"
              call: "trello.create-card"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cards/{id}
          name: card-detail
          description: "Card detail"
          operations:
            - method: GET
              name: get-card
              description: "Get card"
              call: "trello.get-card"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: update-card
              description: "Update card"
              call: "trello.update-card"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/lists/{id}
          name: list-detail
          description: "List detail"
          operations:
            - method: GET
              name: get-list
              description: "Get list"
              call: "trello.get-list"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/search
          name: search
          description: "Search Trello"
          operations:
            - method: GET
              name: search
              description: "Search Trello"
              call: "trello.search"
              with:
                query: "rest.query"
                modelTypes: "rest.modelTypes"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: trello-mcp
      transport: http
      tools:
        - name: get-board
          description: "Get a Trello board by ID"
          hints:
            readOnly: true
            openWorld: false
          call: "trello.get-board"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-board
          description: "Create a new Trello board"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "trello.create-board"
          with:
            name: "tools.name"
            desc: "tools.desc"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-board-cards
          description: "Get all cards on a Trello board"
          hints:
            readOnly: true
            openWorld: true
          call: "trello.get-board-cards"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-board-lists
          description: "Get all lists on a Trello board"
          hints:
            readOnly: true
            openWorld: true
          call: "trello.get-board-lists"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-board-members
          description: "Get all members of a Trello board"
          hints:
            readOnly: true
            openWorld: true
          call: "trello.get-board-members"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-card
          description: "Create a new card on a Trello list"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "trello.create-card"
          with:
            name: "tools.name"
            idList: "tools.idList"
            desc: "tools.desc"
            due: "tools.due"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-card
          description: "Get a Trello card by ID"
          hints:
            readOnly: true
            openWorld: false
          call: "trello.get-card"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-card
          description: "Update a Trello card (name, description, due date, move to list)"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "trello.update-card"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-card
          description: "Delete a Trello card"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "trello.delete-card"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-list
          description: "Get a Trello list by ID"
          hints:
            readOnly: true
            openWorld: false
          call: "trello.get-list"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-list
          description: "Create a new list on a Trello board"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "trello.create-list"
          with:
            name: "tools.name"
            idBoard: "tools.idBoard"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-list-cards
          description: "Get all cards in a specific Trello list"
          hints:
            readOnly: true
            openWorld: true
          call: "trello.get-list-cards"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-member
          description: "Get a Trello member by ID or username"
          hints:
            readOnly: true
            openWorld: false
          call: "trello.get-member"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-member-boards
          description: "Get all boards for a Trello member"
          hints:
            readOnly: true
            openWorld: true
          call: "trello.get-member-boards"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search
          description: "Search across Trello boards, cards, and members"
          hints:
            readOnly: true
            openWorld: true
          call: "trello.search"
          with:
            query: "tools.query"
            modelTypes: "tools.modelTypes"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-webhook
          description: "Create a webhook to receive real-time notifications for Trello changes"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "trello.create-webhook"
          with:
            description: "tools.description"
            callbackURL: "tools.callbackURL"
            idModel: "tools.idModel"
          outputParameters:
            - type: object
              mapping: "$."
