naftiko: 1.0.0-alpha2
info:
  label: Trello REST API — Members
  description: 'Trello REST API — Members. 5 operations. Lead operation: Get a Member. Self-contained Naftiko capability covering
    one Trello business surface.'
  tags:
  - Trello
  - Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRELLO_API_KEY: TRELLO_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-members
    baseUri: https://api.trello.com/1
    description: Trello REST API — Members business capability. Self-contained, no shared references.
    resources:
    - name: members-id
      path: /members/{id}
      operations:
      - name: getmember
        method: GET
        description: Get a Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: actions
          in: query
          type: string
          description: A comma-separated list of action types to include.
        - name: boards
          in: query
          type: string
          description: Filter boards to include.
        - name: organizations
          in: query
          type: string
          description: Filter organizations to include.
        - name: fields
          in: query
          type: string
          description: A comma-separated list of member fields to return.
      - name: updatemember
        method: PUT
        description: Update a Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fullName
          in: query
          type: string
          description: The new full name for the member.
        - name: initials
          in: query
          type: string
          description: The new initials for the member.
        - name: bio
          in: query
          type: string
          description: The new bio for the member.
    - name: members-id-boards
      path: /members/{id}/boards
      operations:
      - name: getmemberboards
        method: GET
        description: Get Boards for a Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: Filter boards by status.
        - name: fields
          in: query
          type: string
          description: A comma-separated list of board fields to return.
        - name: lists
          in: query
          type: string
          description: Whether to include lists.
        - name: organization
          in: query
          type: boolean
          description: Whether to include the organization.
    - name: members-id-cards
      path: /members/{id}/cards
      operations:
      - name: getmembercards
        method: GET
        description: Get Cards for a Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: Filter cards by status.
    - name: members-id-organizations
      path: /members/{id}/organizations
      operations:
      - name: getmemberorganizations
        method: GET
        description: Get Organizations for a Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: Filter organizations.
        - name: fields
          in: query
          type: string
          description: A comma-separated list of organization fields to return.
    authentication:
      type: apikey
      key: key
      value: '{{env.TRELLO_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: rest-members-rest
    port: 8080
    description: REST adapter for Trello REST API — Members. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/members/{id}
      name: members-id
      description: REST surface for members-id.
      operations:
      - method: GET
        name: getmember
        description: Get a Member
        call: rest-members.getmember
        with:
          actions: rest.actions
          boards: rest.boards
          organizations: rest.organizations
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatemember
        description: Update a Member
        call: rest-members.updatemember
        with:
          fullName: rest.fullName
          initials: rest.initials
          bio: rest.bio
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/members/{id}/boards
      name: members-id-boards
      description: REST surface for members-id-boards.
      operations:
      - method: GET
        name: getmemberboards
        description: Get Boards for a Member
        call: rest-members.getmemberboards
        with:
          filter: rest.filter
          fields: rest.fields
          lists: rest.lists
          organization: rest.organization
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/members/{id}/cards
      name: members-id-cards
      description: REST surface for members-id-cards.
      operations:
      - method: GET
        name: getmembercards
        description: Get Cards for a Member
        call: rest-members.getmembercards
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/members/{id}/organizations
      name: members-id-organizations
      description: REST surface for members-id-organizations.
      operations:
      - method: GET
        name: getmemberorganizations
        description: Get Organizations for a Member
        call: rest-members.getmemberorganizations
        with:
          filter: rest.filter
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trello REST API — Members. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-member
      description: Get a Member
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-members.getmember
      with:
        actions: tools.actions
        boards: tools.boards
        organizations: tools.organizations
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
    - name: update-member
      description: Update a Member
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-members.updatemember
      with:
        fullName: tools.fullName
        initials: tools.initials
        bio: tools.bio
      outputParameters:
      - type: object
        mapping: $.
    - name: get-boards-member
      description: Get Boards for a Member
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-members.getmemberboards
      with:
        filter: tools.filter
        fields: tools.fields
        lists: tools.lists
        organization: tools.organization
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cards-member
      description: Get Cards for a Member
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-members.getmembercards
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: get-organizations-member
      description: Get Organizations for a Member
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-members.getmemberorganizations
      with:
        filter: tools.filter
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
