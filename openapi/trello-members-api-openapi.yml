openapi: 3.2.0
info:
  title: Trello Members API
  version: '1.0'
  description: 'Operations tagged Members across 2 of this provider''s published API definitions: trello-rest-api-openapi.yml, trello-rest-api-swagger-v3.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.trello.com/1
  description: Trello API v1 Production Server
tags:
- name: Members
  description: Operations for retrieving and updating member profiles, boards, organizations, and notification settings.
paths:
  /members/{id}:
    get:
      operationId: getMember
      summary: Get a Member
      description: Retrieves a member by their identifier or username.
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: actions
        in: query
        description: A comma-separated list of action types to include.
        schema:
          type: string
      - name: boards
        in: query
        description: Filter boards to include.
        schema:
          type: string
          enum:
          - all
          - closed
          - members
          - none
          - open
          - organization
          - public
          - starred
          default: none
      - name: organizations
        in: query
        description: Filter organizations to include.
        schema:
          type: string
          enum:
          - all
          - members
          - none
          - public
          default: none
      - name: fields
        in: query
        description: A comma-separated list of member fields to return.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Unauthorized.
        '404':
          description: Member not found.
      security:
      - apiKey: []
        apiToken: []
    put:
      operationId: updateMember
      summary: Update a Member
      description: Updates a member's profile fields such as full name, initials, and bio.
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: fullName
        in: query
        description: The new full name for the member.
        schema:
          type: string
          minLength: 1
          maxLength: 16384
      - name: initials
        in: query
        description: The new initials for the member.
        schema:
          type: string
          minLength: 1
          maxLength: 4
      - name: bio
        in: query
        description: The new bio for the member.
        schema:
          type: string
          maxLength: 16384
      responses:
        '200':
          description: Successfully updated the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Unauthorized.
        '404':
          description: Member not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /members/{id}/boards:
    get:
      operationId: getMemberBoards
      summary: Get Boards for a Member
      description: Retrieves all boards that a member has access to.
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: filter
        in: query
        description: Filter boards by status.
        schema:
          type: string
          default: all
      - name: fields
        in: query
        description: A comma-separated list of board fields to return.
        schema:
          type: string
      - name: lists
        in: query
        description: Whether to include lists.
        schema:
          type: string
          enum:
          - all
          - closed
          - none
          - open
          default: none
      - name: organization
        in: query
        description: Whether to include the organization.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successfully retrieved member boards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
        '401':
          description: Unauthorized.
        '404':
          description: Member not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /members/{id}/cards:
    get:
      operationId: getMemberCards
      summary: Get Cards for a Member
      description: Retrieves all cards assigned to a member.
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: filter
        in: query
        description: Filter cards by status.
        schema:
          type: string
          default: visible
      responses:
        '200':
          description: Successfully retrieved member cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized.
        '404':
          description: Member not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /members/{id}/organizations:
    get:
      operationId: getMemberOrganizations
      summary: Get Organizations for a Member
      description: Retrieves all organizations (workspaces) that a member belongs to.
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: filter
        in: query
        description: Filter organizations.
        schema:
          type: string
          default: all
      - name: fields
        in: query
        description: A comma-separated list of organization fields to return.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved member organizations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized.
        '404':
          description: Member not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /members/{id}/{field}:
    get:
      tags:
      - Members
      summary: Get a field on a Member
      description: Get a particular property of a member
      operationId: get-members-id-field
      security:
      - OAuth2: []
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: field
        in: path
        description: One of the member [fields](/cloud/trello/guides/rest-api/object-definitions/)
        required: true
        schema:
          $ref: '#/components/schemas/MemberFields'
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Member_2'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/actions:
    get:
      tags:
      - Members
      summary: Get a Member's Actions
      description: List the actions for a member
      operationId: get-members-id-actions
      security:
      - OAuth2: []
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: filter
        in: query
        description: A comma-separated list of [action types](https://developer.atlassian.com/cloud/trello/guides/rest-api/action-types/).
        required: false
        schema:
          type: string
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/Member_2'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/boardBackgrounds:
    get:
      tags:
      - Members
      summary: Get Member's custom Board backgrounds
      description: Get a member's custom board backgrounds
      operationId: get-members-id-boardbackgrounds
      security:
      - OAuth2:
        - read:member:trello
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: filter
        in: query
        description: 'One of: `all`, `custom`, `default`, `none`, `premium`'
        required: false
        schema:
          enum:
          - all
          - custom
          - default
          - none
          - premium
          type: string
          default: all
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/BoardBackground'
    post:
      tags:
      - Members
      summary: Upload new boardBackground for Member
      description: Upload a new boardBackground
      operationId: post-members-id-boardbackgrounds-1
      security:
      - OAuth2:
        - write:member:trello
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: file
        in: query
        description: ''
        required: true
        schema:
          type: string
          format: binary
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/BoardBackground'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/boardBackgrounds/{idBackground}:
    parameters:
    - name: id
      in: path
      description: The ID or username of the member
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    - name: idBackground
      in: path
      description: The ID of the board background
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Members
      summary: Get a boardBackground of a Member
      description: Get a member's board background
      operationId: get-members-id-boardbackgrounds-idbackground
      security:
      - OAuth2:
        - read:member:trello
      parameters:
      - name: fields
        in: query
        description: '`all` or a comma-separated list of: `brightness`, `fullSizeUrl`, `scaled`, `tile`'
        required: false
        schema:
          type: string
          default: all
          enum:
          - all
          - brightness
          - fullSizeUrl
          - scaled
          - tile
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardBackground'
    put:
      tags:
      - Members
      summary: Update a Member's custom Board background
      description: Update a board background
      operationId: put-members-id-boardbackgrounds-idbackground
      security:
      - OAuth2:
        - write:member:trello
      parameters:
      - name: brightness
        in: query
        description: 'One of: `dark`, `light`, `unknown`'
        required: false
        schema:
          enum:
          - dark
          - light
          - unknown
          type: string
      - name: tile
        in: query
        description: Whether the background should be tiled
        required: false
        schema:
          type: boolean
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardBackground'
    delete:
      tags:
      - Members
      summary: Delete a Member's custom Board background
      description: Delete a board background
      operationId: delete-members-id-boardbackgrounds-idbackground
      security:
      - OAuth2:
        - write:member:trello
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /members/{id}/boardStars:
    get:
      tags:
      - Members
      summary: Get a Member's boardStars
      description: List a member's board stars
      operationId: get-members-id-boardstars
      security:
      - OAuth2:
        - read:member:trello
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      deprecated: false
      responses:
        '200':
          description: Success
    post:
      tags:
      - Members
      summary: Create Star for Board
      description: Star a new board on behalf of a Member
      operationId: post-members-id-boardstars
      security:
      - OAuth2:
        - write:member:trello
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/TrelloID'
          - type: string
      - name: idBoard
        in: query
        description: The ID of the board to star
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: pos
        in: query
        description: The position of the newly starred board. `top`, `bottom`, or a positive float.
        required: true
        schema:
          $ref: '#/components/schemas/posStringOrNumber'
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardStars'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/boardStars/{idStar}:
    parameters:
    - name: id
      in: path
      description: The ID or username of the member
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    - name: idStar
      in: path
      description: The ID of the board star
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Members
      summary: Get a boardStar of Member
      description: Get a specific boardStar
      operationId: get-members-id-boardstars-idstar
      security:
      - OAuth2:
        - read:member:trello
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardStars'
    put:
      tags:
      - Members
      summary: Update the position of a boardStar of Member
      description: Update the position of a starred board
      operationId: put-members-id-boardstars-idstar
      security:
      - OAuth2:
        - write:member:trello
      parameters:
      - name: pos
        in: query
        description: New position for the starred board. `top`, `bottom`, or a positive float.
        required: false
        schema:
          $ref: '#/components/schemas/posStringOrNumber'
      deprecated: false
      responses:
        '200':
          description: Success
    delete:
      tags:
      - Members
      summary: Delete Star for Board
      description: Unstar a board
      operationId: delete-members-id-boardstars-idstar
      security:
      - OAuth2:
        - write:member:trello
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /members/{id}/boardsInvited:
    get:
      tags:
      - Members
      summary: Get Boards the Member has been invited to
      description: Get the boards the member has been invited to
      operationId: get-members-id-boardsinvited
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: fields
        in: query
        description: '`all` or a comma-separated list of board [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        required: false
        schema:
          $ref: '#/components/schemas/BoardFields'
          default: all
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board_2'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/customBoardBackgrounds:
    parameters:
    - name: id
      in: path
      description: The ID or username of the member
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Members
      summary: Get a Member's custom Board Backgrounds
      description: Get a member's custom board backgrounds
      operationId: get-members-id-customboardbackgrounds
      security:
      - OAuth2:
        - read:member:trello
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardBackground'
    post:
      tags:
      - Members
      summary: Create a new custom Board Background
      description: Upload a new custom board background
      operationId: membersidcustomboardbackgrounds-1
      security:
      - OAuth2: []
      parameters:
      - name: file
        in: query
        description: ''
        required: true
        schema:
          type: string
          format: binary
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardBackground'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/customBoardBackgrounds/{idBackground}:
    parameters:
    - name: id
      in: path
      description: The ID or username of the member
      required: true
      schema:
        oneOf:
        - $ref: '#/components/schemas/TrelloID'
        - type: string
    - name: idBackground
      in: path
      description: The ID of the custom background
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Members
      summary: Get custom Board Background of Member
      description: Get a specific custom board background
      operationId: get-members-id-customboardbackgrounds-idbackground
      security:
      - OAuth2: []
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardBackground'
    put:
      tags:
