      parameters:
      - name: file
        in: query
        description: ''
        required: true
        schema:
          type: string
          format: binary
      - name: name
        in: query
        description: Name for the emoji. 2 - 64 characters
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomEmoji'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/customEmoji/{idEmoji}:
    get:
      tags:
      - Members
      summary: Get a Member's custom Emoji
      operationId: membersidcustomemojiidemoji
      security:
      - OAuth2:
        - read:member:trello
      parameters:
      - name: id
        in: path
        description: The ID or username of the member
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: idEmoji
        in: path
        description: The ID of the custom emoji
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: fields
        in: query
        description: '`all` or a comma-separated list of `name`, `url`'
        required: false
        explode: false
        style: form
        schema:
          type: string
          enum:
          - name
          - url
          - all
          default: all
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomEmoji'
    servers:
    - url: https://api.trello.com/1
  /members/{id}/customStickers:
    parameters:
    - name: id
      in: path
      description: The ID or username of the member
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Members
      summary: Get Member's custom Stickers
