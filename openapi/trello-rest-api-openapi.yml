          description: Unauthorized.
        '404':
          description: Organization or member not found.
    delete:
      operationId: removeOrganizationMember
      summary: Remove a Member from an Organization
      description: >-
        Removes a member from an organization.
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/idParam'
        - name: idMember
          in: path
          required: true
          description: The ID of the member to remove.
          schema:
            type: string
      responses:
        '200':
          description: Successfully removed the member.
        '401':
          description: Unauthorized.
        '404':
          description: Organization or member not found.
  /plugins/{id}:
    get:
      operationId: getPlugin
      summary: Get a Plugin
      description: >-
        Retrieves a Power-Up plugin by its identifier.
      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully retrieved the plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '401':
          description: Unauthorized.
        '404':
          description: Plugin not found.
    put:
      operationId: updatePlugin
      summary: Update a Plugin
      description: >-
        Updates a Power-Up plugin's information.
      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully updated the plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '401':
          description: Unauthorized.
        '404':
          description: Plugin not found.
  /plugins/{id}/listings:
    post:
      operationId: createPluginListing
      summary: Create a Listing for a Plugin
      description: >-
        Creates a new marketplace listing for a Power-Up plugin.
      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: The description for the listing.
                locale:
                  type: string
                  description: The locale for the listing.
                overview:
                  type: string
                  description: The overview text for the listing.
                name:
                  type: string
                  description: The name for the listing.
      responses:
        '200':
          description: Successfully created the listing.
        '401':
          description: Unauthorized.
        '404':
          description: Plugin not found.
  /search:
    get:
      operationId: search
      summary: Search Trello
      description: >-
        Searches for Trello objects matching the provided query string across
        boards, cards, members, and organizations.
      tags:
        - Search
      parameters:
        - name: query
          in: query
          required: true
          description: The search query string.
          schema:
            type: string
            minLength: 1
            maxLength: 16384
        - name: idBoards
          in: query
          description: A comma-separated list of board IDs to limit the search to.
          schema:
            type: string
        - name: idOrganizations
          in: query
          description: A comma-separated list of organization IDs to limit the search to.
          schema:
            type: string
        - name: idCards
          in: query
          description: A comma-separated list of card IDs to limit the search to.
          schema:
            type: string
        - name: modelTypes
          in: query
          description: >-
            A comma-separated list of model types to return. Valid values are
            actions, boards, cards, members, and organizations.
          schema:
            type: string
            default: all
        - name: board_fields
          in: query
          description: Board fields to return.
          schema:
            type: string
        - name: boards_limit
          in: query
          description: Maximum number of boards to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: card_fields
          in: query
          description: Card fields to return.
          schema:
            type: string
        - name: cards_limit
          in: query
          description: Maximum number of cards to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: cards_page
          in: query
          description: Page number of card results.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: partial
          in: query
          description: Whether to return partial matches.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successfully returned search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          description: Unauthorized.
  /search/members:
    get:
      operationId: searchMembers
      summary: Search Members
      description: >-
        Searches for Trello members matching the provided query string.
      tags:
        - Search
      parameters:
        - name: query
          in: query
          required: true
          description: The search query string.
          schema:
            type: string
            minLength: 1
            maxLength: 16384
        - name: limit
          in: query
          description: Maximum number of members to return.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
        - name: idBoard
          in: query
          description: The ID of a board to limit the search to.
          schema:
            type: string
        - name: idOrganization
          in: query
          description: The ID of an organization to limit the search to.
          schema:
            type: string
        - name: onlyOrgMembers
          in: query
          description: Whether to limit results to members of the given organization.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successfully returned member search results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          description: Unauthorized.
  /tokens/{token}:
    get:
      operationId: getToken
      summary: Get a Token
      description: >-
        Retrieves information about an API token.
      tags:
        - Tokens
      parameters:
        - name: token
          in: path
          required: true
          description: The API token to retrieve information about.
          schema:
            type: string
        - name: fields
          in: query
          description: A comma-separated list of token fields to return.
          schema:
            type: string
            default: all
        - name: webhooks
          in: query
          description: Whether to include webhooks associated with the token.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successfully retrieved the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Unauthorized.
        '404':
          description: Token not found.
    delete:
      operationId: deleteToken
      summary: Delete a Token
      description: >-
        Revokes and deletes an API token. This will also remove any webhooks
        associated with the token.
      tags:
        - Tokens
      parameters:
        - name: token
          in: path
          required: true
          description: The API token to delete.
          schema:
            type: string
      responses:
        '200':
          description: Successfully deleted the token.
        '401':
          description: Unauthorized.
        '404':
          description: Token not found.
  /tokens/{token}/webhooks:
    get:
      operationId: getTokenWebhooks
      summary: Get Webhooks for a Token
      description: >-
        Retrieves all webhooks associated with a token.
      tags:
        - Tokens
      parameters:
        - name: token
          in: path
          required: true
          description: The API token.
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized.
        '404':
          description: Token not found.
    post:
      operationId: createTokenWebhook
      summary: Create a Webhook for a Token
      description: >-
        Creates a new webhook for a token. Trello will make an HTTP HEAD
        request to the callback URL to verify it before creating the webhook.
      tags:
        - Tokens
      parameters:
        - name: token
          in: path
          required: true
          description: The API token.
          schema:
            type: string
        - name: callbackURL
          in: query
          required: true
          description: A valid URL that will receive webhook callbacks via HTTP POST.
          schema:
            type: string
            format: uri
        - name: idModel
          in: query
          required: true
          description: The ID of the model to watch for changes.
          schema:
            type: string
        - name: description
          in: query
          description: A description for the webhook.
          schema:
            type: string
            maxLength: 16384
      responses:
        '200':
          description: Successfully created the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request. Invalid callback URL or model ID.
        '401':
          description: Unauthorized.
  /webhooks:
    post:
      operationId: createWebhook
      summary: Create a Webhook
      description: >-
        Creates a new webhook. Trello will make an HTTP HEAD request to the
        callback URL to verify it returns a 200 status code before creating
        the webhook.
      tags:
        - Webhooks
      parameters:
        - name: callbackURL
          in: query
          required: true
          description: A valid URL that will receive webhook callbacks via HTTP POST.
          schema:
            type: string
            format: uri
        - name: idModel
          in: query
          required: true
          description: The ID of the model to watch for changes.
          schema:
            type: string
        - name: description
          in: query
          description: A description for the webhook.
          schema:
            type: string
            maxLength: 16384
        - name: active
          in: query
          description: Whether the webhook is active.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Successfully created the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request. Callback URL did not return 200 on HEAD request.
        '401':
          description: Unauthorized.
  /webhooks/{id}:
    get:
      operationId: getWebhook
      summary: Get a Webhook
      description: >-
        Retrieves a webhook by its identifier.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully retrieved the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized.
        '404':
          description: Webhook not found.
    put:
      operationId: updateWebhook
      summary: Update a Webhook
      description: >-
        Updates a webhook's callback URL, model, description, or active status.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/idParam'
        - name: callbackURL
          in: query
          description: The new callback URL for the webhook.
          schema:
            type: string
            format: uri
        - name: idModel
          in: query
          description: The new model ID to watch.
          schema:
            type: string
        - name: description
          in: query
          description: The new description for the webhook.
          schema:
            type: string
            maxLength: 16384
        - name: active
          in: query
          description: Whether the webhook is active.
          schema:
            type: boolean
      responses:
        '200':
          description: Successfully updated the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized.
        '404':
          description: Webhook not found.
    delete:
      operationId: deleteWebhook
      summary: Delete a Webhook
      description: >-
        Permanently deletes a webhook.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully deleted the webhook.
        '401':
          description: Unauthorized.
        '404':
          description: Webhook not found.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: key
      description: >-
        Your Trello API key, obtained from the Power-Ups admin page at
        https://trello.com/power-ups/admin.
    apiToken:
      type: apiKey
      in: query
      name: token
      description: >-
        A user token that grants access to Trello resources. Obtained by
        authorizing via the /1/authorize route or OAuth 1.0.
  parameters:
    idParam:
      name: id
      in: path
      required: true
      description: The ID of the resource.
      schema:
        type: string
  schemas:
    Action:
      type: object
      description: >-
        Represents an activity event that occurred on a Trello object, such as
        creating a card, adding a comment, or moving a card between lists.
      properties:
        id:
          type: string
          description: The unique identifier for the action.
        idMemberCreator:
          type: string
          description: The ID of the member who performed the action.
        type:
          type: string
          description: The type of action that was performed.
        date:
          type: string
          format: date-time
          description: The date and time the action was performed.
        data:
          type: object
          description: >-
            Context data about the action, including references to the objects
            involved.
          properties:
            text:
              type: string
              description: The text content of the action, if applicable.
            board:
              type: object
              description: Reference to the board involved in the action.
              properties:
                id:
                  type: string
                name:
                  type: string
                shortLink:
                  type: string
            card:
              type: object
              description: Reference to the card involved in the action.
              properties:
                id:
                  type: string
                name:
                  type: string
                idShort:
                  type: integer
                shortLink:
                  type: string
            list:
              type: object
              description: Reference to the list involved in the action.
              properties:
                id:
                  type: string
                name:
                  type: string
            old:
              type: object
              description: The previous values of fields that were changed.
        display:
          type: object
          description: Display information for rendering the action.
        memberCreator:
          $ref: '#/components/schemas/Member'
    Board:
      type: object
      description: >-
        Represents a Trello board, which is the primary organizational unit
        containing lists and cards.
      properties:
        id:
          type: string
          description: The unique identifier for the board.
        name:
          type: string
          description: The name of the board.
        desc:
          type: string
          description: The description of the board.
        descData:
          type: object
          description: Additional description data.
        closed:
          type: boolean
          description: Whether the board is closed (archived).
        idMemberCreator:
          type: string
          description: The ID of the member who created the board.
        idOrganization:
          type: string
          description: The ID of the organization the board belongs to.
        pinned:
          type: boolean
          description: Whether the board is pinned.
        url:
          type: string
          format: uri
          description: The full URL of the board.
        shortUrl:
          type: string
          format: uri
          description: The short URL of the board.
        shortLink:
          type: string
          description: The short link identifier for the board.
        prefs:
          type: object
          description: Board preferences and settings.
          properties:
            permissionLevel:
              type: string
              enum:
                - org
                - private
                - public
            hideVotes:
              type: boolean
            voting:
              type: string
            comments:
              type: string
            selfJoin:
              type: boolean
            cardCovers:
              type: boolean
            cardAging:
              type: string
              enum:
                - pirate
                - regular
            background:
              type: string
            backgroundColor:
              type: string
            backgroundImage:
              type: string
            backgroundTile:
              type: boolean
            backgroundBrightness:
              type: string
        labelNames:
          type: object
          description: The names assigned to each label color on the board.
          properties:
            green:
              type: string
            yellow:
              type: string
            orange:
              type: string
            red:
              type: string
            purple:
              type: string
            blue:
              type: string
            sky:
              type: string
            lime:
              type: string
            pink:
              type: string
            black:
              type: string
        starred:
          type: boolean
          description: Whether the authenticated member has starred the board.
        memberships:
          type: array
          description: The board's membership records.
          items:
            $ref: '#/components/schemas/Membership'
        dateLastActivity:
          type: string
          format: date-time
          description: The date and time of the last activity on the board.
        dateLastView:
          type: string
          format: date-time
          description: The date and time the authenticated member last viewed the board.
    Card:
      type: object
      description: >-
        Represents a Trello card, which is the fundamental unit of work on a
        board. Cards live within lists and can have members, labels, checklists,
        attachments, due dates, and comments.
      properties:
        id:
          type: string
          description: The unique identifier for the card.
        name:
          type: string
          description: The name (title) of the card.
        desc:
          type: string
          description: The description of the card in Markdown.
        closed:
          type: boolean
          description: Whether the card is archived.
        idBoard:
          type: string
          description: The ID of the board the card is on.
        idList:
          type: string
          description: The ID of the list the card is in.
        idShort:
          type: integer
          description: The short numeric identifier for the card within its board.
        idMembers:
          type: array
          description: The IDs of members assigned to the card.
          items:
            type: string
        idLabels:
          type: array
          description: The IDs of labels on the card.
          items:
            type: string
        idChecklists:
          type: array
          description: The IDs of checklists on the card.
          items:
            type: string
        idAttachmentCover:
          type: string
          description: The ID of the attachment used as the card cover.
        pos:
          type: number
          description: The position of the card in its list.
        due:
          type: string
          format: date-time
          description: The due date for the card.
        dueComplete:
          type: boolean
          description: Whether the due date has been marked as complete.
        start:
          type: string
          format: date-time
          description: The start date for the card.
        url:
          type: string
          format: uri
          description: The full URL of the card.
        shortUrl:
          type: string
          format: uri
          description: The short URL of the card.
        shortLink:
          type: string
          description: The short link identifier for the card.
        subscribed:
          type: boolean
          description: Whether the authenticated member is subscribed to the card.
        dateLastActivity:
          type: string
          format: date-time
          description: The date and time of the last activity on the card.
        cover:
          type: object
          description: The card's cover image settings.
          properties:
            idAttachment:
              type: string
            color:
              type: string
            idUploadedBackground:
              type: string
            size:
              type: string
              enum:
                - normal
                - full
            brightness:
              type: string
            idPlugin:
              type: string
        labels:
          type: array
          description: The labels on the card.
          items:
            $ref: '#/components/schemas/Label'
        badges:
          type: object
          description: Badge counts and indicators for the card.
          properties:
            votes:
              type: integer
            attachments:
              type: integer
            comments:
              type: integer
            checkItems:
              type: integer
            checkItemsChecked:
              type: integer
            description:
              type: boolean
            due:
              type: string
              format: date-time
            dueComplete:
              type: boolean
            subscribed:
              type: boolean
    TrelloList:
      type: object
      description: >-
        Represents a list on a Trello board. Lists are vertical columns that
        contain cards and represent stages in a workflow.
      properties:
        id:
          type: string
          description: The unique identifier for the list.
        name:
          type: string
          description: The name of the list.
        closed:
          type: boolean
          description: Whether the list is closed (archived).
        idBoard:
          type: string
          description: The ID of the board the list belongs to.
        pos:
          type: number
          description: The position of the list on the board.
        subscribed:
          type: boolean
          description: Whether the authenticated member is subscribed to the list.
        softLimit:
          type: string
          description: A soft limit for the number of cards in the list.
    Label:
      type: object
      description: >-
        Represents a color-coded label that can be applied to cards for
        categorization and filtering.
      properties:
        id:
          type: string
          description: The unique identifier for the label.
        idBoard:
          type: string
          description: The ID of the board the label belongs to.
        name:
          type: string
          description: The name of the label.
        color:
          type: string
          description: The color of the label.
          enum:
            - yellow
            - purple
            - blue
            - red
            - green
            - orange
            - black
            - sky
            - pink
            - lime
            - 
    Member:
      type: object
      description: >-
        Represents a Trello user who can be a member of boards, organizations,
        and cards.
      properties:
        id:
          type: string
          description: The unique identifier for the member.
        username:
          type: string
          description: The username of the member.
        fullName:
          type: string
          description: The full name of the member.
        initials:
          type: string
          description: The initials of the member.
        bio:
          type: string
          description: The biography of the member.
        avatarHash:
          type: string
          description: The hash of the member's avatar image.
        avatarUrl:
          type: string
          format: uri
          description: The URL of the member's avatar image.
        url:
          type: string
          format: uri
          description: The URL of the member's Trello profile.
        confirmed:
          type: boolean
          description: Whether the member's email has been confirmed.
        memberType:
          type: string
          description: The type of member account.
        status:
          type: string
          description: The activity status of the member.
        idOrganizations:
          type: array
          description: The IDs of organizations the member belongs to.
          items:
            type: string
        idBoards:
          type: array
          description: The IDs of boards the member has access to.
          items:
            type: string
    Membership:
      type: object
      description: >-
        Represents a membership record linking a member to a board or
        organization with a specific role.
      properties:
        id:
          type: string
          description: The unique identifier for the membership.
        idMember:
          type: string
          description: The ID of the member.
        memberType:
          type: string
          description: The type of membership.
          enum:
            - admin
            - normal
            - observer
        unconfirmed:
          type: boolean
          description: Whether the membership is unconfirmed.
        deactivated:
          type: boolean
          description: Whether the membership is deactivated.
    Checklist:
      type: object
      description: >-
        Represents a checklist on a card, containing a list of check items
        that can be marked as complete or incomplete.
      properties:
        id:
          type: string
          description: The unique identifier for the checklist.
        name:
          type: string
          description: The name of the checklist.
        idBoard:
          type: string
          description: The ID of the board the checklist belongs to.
        idCard:
          type: string
          description: The ID of the card the checklist is on.
        pos:
          type: number
          description: The position of the checklist on the card.
        checkItems:
          type: array
          description: The check items in the checklist.
          items:
            $ref: '#/components/schemas/CheckItem'
    CheckItem:
      type: object
      description: >-
        Represents a single item in a checklist that can be checked or
        unchecked.
      properties:
        id:
          type: string
          description: The unique identifier for the check item.
        name:
          type: string
          description: The name of the check item.
        state:
          type: string
          description: The completion state of the check item.
          enum:
            - complete
            - incomplete
        idChecklist:
          type: string
          description: The ID of the checklist the check item belongs to.
        pos:
          type: number
          description: The position of the check item in the checklist.
        due:
          type: string
          format: date-time
          description: The due date for the check item.
        idMember:
          type: string
          description: The ID of the member assigned to the check item.
    Attachment:
      type: object
      description: >-
        Represents a file or URL attachment on a card.
      properties:
        id:
          type: string
          description: The unique identifier for the attachment.
        name:
          type: string
          description: The name of the attachment.
        url:
          type: string
          format: uri
          description: The URL of the attachment.
        bytes:
          type: integer
          description: The size of the attachment in bytes.
        date:
          type: string
          format: date-time
          description: The date the attachment was added.
        edgeColor:
          type: string
          description: The edge color of the attachment preview.
        idMember:
          type: string
          description: The ID of the member who added the attachment.
        isUpload:
          type: boolean
          description: Whether the attachment was uploaded (vs. linked).
        mimeType:
          type: string
          description: The MIME type of the attachment.
        previews:
          type: array
          description: Preview image versions of the attachment.
          items:
            type: object
            properties:
              id:
                type: string
              url:
                type: string
                format: uri
              width:
                type: integer
              height:
                type: integer
              bytes:
                type: integer
    Notification:
      type: object
      description: >-
        Represents a notification sent to a member about activity on their
        boards, cards, or organizations.
      properties:
        id:
          type: string
          description: The unique identifier for the notification.
        type:
          type: string
          description: The type of notification.
        date:
          type: string
          format: date-time
          description: The date the notification was created.
        unread:
          type: boolean
          description: Whether the notification is unread.
        data:
          type: object
          description: Context data about the notification.
          properties:
            board:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                shortLink:
                  type: string
            card:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                idShort:
                  type: integer
                shortLink:
                  type: string
            text:
              type: string
        idMemberCreator:
          type: string
          description: The ID of the member who triggered the notification.
        memberCreator:
          $ref: '#/components/schemas/Member'
    Organization:
      type: object
      description: >-
        Represents a Trello organization (workspace), which is a group of
        members who share boards.
      properties:
        id:
          type: string
          description: The unique identifier for the organization.
        name:
          type: string
          description: The short name (URL-friendly slug) of the organization.
        displayName:
          type: string
          description: The display name of the organization.
        desc:
          type: string
          description: The description of the organization.
        url:
          type: string
          format: uri
          description: The URL of the organization.
        website:
          type: string
          format: uri
          description: The website of the organization.
        logoHash:
          type: string
          description: The hash of the organization's logo.
        products:
          type: array
          description: The product IDs associated with the organization.
          items:
            type: integer
        idBoards:
          type: array
          description: The IDs of boards in the organization.
          items:
            type: string
        memberships:
          type: array
          description: The membership records for the organization.
          items:
            $ref: '#/components/schemas/Membership'
    Webhook:
      type: object
      description: >-
        Represents a webhook that delivers HTTP POST callbacks to a specified
        URL when changes occur on a watched Trello model.
      properties:
        id:
          type: string
          description: The unique identifier for the webhook.
        description:
          type: string
          description: A description of the webhook.
        idModel:
          type: string
          description: The ID of the model being watched.
        callbackURL:
          type: string
          format: uri
          description: The URL that will receive webhook callbacks.
        active:
          type: boolean
          description: Whether the webhook is active.
        consecutiveFailures:
          type: integer
          description: The number of consecutive delivery failures.
        firstConsecutiveFailDate:
          type: string
          format: date-time
          description: The date of the first consecutive failure.
    Token:
      type: object
      description: >-
        Represents an API token that grants access to Trello resources on
        behalf of a user.
      properties:
        id:
          type: string
          description: The unique identifier for the token.
        identifier:
          type: string
          description: A human-readable identifier for the token.
        idMember:
          type: string
          description: The ID of the member the token belongs to.
        dateCreated:
          type: string
          format: date-time
          description: The date the token was created.
        dateExpires:
          type: string
          format: date-time
          description: The date the token expires.
        permissions:
          type: array
          description: The permissions granted by the token.
          items:
            type: object
            properties:
              idModel:
                type: string
                description: The ID of the model the permission applies to.
              modelType:
                type: string
                description: The type of model.
              read:
                type: boolean
                description: Whether read access is granted.
              write:
                type: boolean
                description: Whether write access is granted.
    CustomField:
      type: object
      description: >-
        Represents a custom field definition on a board that allows structured
        data to be added to cards.
      properties:
        id:
          type: string
          description: The unique identifier for the custom field.
        idModel:
          type: string
          description: The ID of the model (board) the custom field belongs to.
        modelType:
          type: string
          description: The type of model (board).
        fieldGroup:
          type: string
          description: The field group identifier.
        name:
          type: string
          description: The name of the custom field.
        type:
          type: string
          description: The data type of the custom field.
          enum:
            - checkbox
            - date
            - list
            - number
            - text
        pos:
          type: number
          description: The position of the custom field.
        display:
          type: object
          description: Display settings for the custom field.
          properties:
            cardFront:
              type: boolean
              description: Whether to display on card fronts.
        options:
          type: array
          description: Options for list-type custom fields.
          items:
            type: object
            properties:
              id:
                type: string
              idCustomField:
                type: string
              value:
                type: object
                properties:
                  text:
                    type: string
              color:
                type: string
              pos:
                type: integer
    CustomFieldItem:
      type: object
      description: >-
        Represents a custom field value set on a specific card.
      properties:
        id:
          type: string
          description: The unique identifier for the custom field item.
        idCustomField:
          type: string
          description: The ID of the custom field definition.
        idModel:
          type: string
          description: The ID of the card.
        modelType:
          type: string
          description: The type of model (card).
        value:
          type: object
          description: >-
            The value of the custom field. Structure depends on the field type.
          properties:
            text:
              type: string
            number:
              type: string
            date:
              type: string
              format: date-time
            checked:
              type: string
        idValue:
          type: string
          description: The ID of the selected option for list-type fields.
    Plugin:
      type: object
      description: >-
        Represents a Power-Up plugin that extends Trello functionality.
      properties:
        id:
          type: string
          description: The unique identifier for the plugin.
        name:
          type: string
          description: The name of the plugin.
        public:
          type: boolean
          description: Whether the plugin is publicly available.
        url:
          type: string
          format: uri
          description: The URL for the plugin.
        capabilities:
          type: array
          description: The capabilities provided by the plugin.
          items:
            type: string
        idOrganizationOwner:
          type: string
          description: The ID of the organization that owns the plugin.
    Sticker:
      type: object
      description: >-
        Represents a decorative sticker placed on a card.
      properties:
        id:
          type: string
          description: The unique identifier for the sticker.
        image:
          type: string
          description: The image identifier for the sticker.
        imageUrl:
          type: string
          format: uri
          description: The URL of the sticker image.
        top:
          type: number
          description: The top position as a percentage.
        left:
          type: number
          description: The left position as a percentage.
        zIndex:
          type: integer
          description: The z-index of the sticker.
        rotate:
          type: number
          description: The rotation in degrees.
    Reaction:
      type: object
      description: >-
        Represents an emoji reaction on an action (comment).
      properties:
        id:
          type: string
          description: The unique identifier for the reaction.
        idMember:
          type: string
          description: The ID of the member who added the reaction.
        idModel:
          type: string
          description: The ID of the action the reaction is on.
        idEmoji:
          type: string
          description: The ID of the emoji.
        member:
          $ref: '#/components/schemas/Member'
        emoji:
          type: object
          description: The emoji details.
          properties:
            unified:
              type: string
            native:
              type: string
            name:
              type: string
            shortName:
              type: string
            skinVariation:
              type: string
    SearchResult:
      type: object
      description: >-
        Represents the results of a search query across Trello objects.
      properties:
        options:
          type: object
          description: The search options that were used.
          properties:
            terms:
              type: array
              items:
                type: object
            modifiers:
              type: array
              items:
                type: object
            modelTypes:
              type: array
              items:
                type: string
            partial:
              type: boolean
        boards:
          type: array
          description: Boards matching the search query.
          items:
            $ref: '#/components/schemas/Board'
        cards:
          type: array
          description: Cards matching the search query.
          items:
            $ref: '#/components/schemas/Card'
        members:
          type: array
          description: Members matching the search query.
          items:
            $ref: '#/components/schemas/Member'
        organizations:
          type: array
          description: Organizations matching the search query.
          items:
            $ref: '#/components/schemas/Organization'
