            type: string
        - name: idBoard
          in: query
          description: The ID of the board to move the card to.
          schema:
            type: string
        - name: pos
          in: query
          description: The new position of the card.
          schema:
            type: string
        - name: due
          in: query
          description: The new due date for the card.
          schema:
            type: string
            format: date-time
        - name: start
          in: query
          description: The start date for the card.
          schema:
            type: string
            format: date-time
        - name: dueComplete
