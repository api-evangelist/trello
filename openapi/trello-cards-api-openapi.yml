openapi: 3.2.0
info:
  title: Trello Cards API
  version: '1.0'
  description: 'Operations tagged Cards across 2 of this provider''s published API definitions: trello-rest-api-openapi.yml, trello-rest-api-swagger-v3.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.trello.com/1
  description: Trello API v1 Production Server
tags:
- name: Cards
  description: Operations for creating, retrieving, updating, and deleting cards, including managing card attachments, checklists, comments, labels, members, and stickers.
paths:
  /cards:
    post:
      operationId: createCard
      summary: Create a Card
      description: Creates a new card on the specified list.
      tags:
      - Cards
      parameters:
      - name: name
        in: query
        description: The name for the card.
        schema:
          type: string
          minLength: 0
          maxLength: 16384
      - name: desc
        in: query
        description: The description for the card.
        schema:
          type: string
          maxLength: 16384
      - name: pos
        in: query
        description: The position of the card in the list.
        schema:
          type: string
          default: bottom
      - name: due
        in: query
        description: The due date for the card.
        schema:
          type: string
          format: date-time
      - name: start
        in: query
        description: The start date for the card.
        schema:
          type: string
          format: date-time
      - name: dueComplete
        in: query
        description: Whether the due date is complete.
        schema:
          type: boolean
          default: false
      - name: idList
        in: query
        required: true
        description: The ID of the list the card should be created in.
        schema:
          type: string
      - name: idMembers
        in: query
        description: Comma-separated list of member IDs to add to the card.
        schema:
          type: string
      - name: idLabels
        in: query
        description: Comma-separated list of label IDs to add to the card.
        schema:
          type: string
      - name: urlSource
        in: query
        description: A URL to attach to the card.
        schema:
          type: string
          format: uri
      - name: idCardSource
        in: query
        description: The ID of a card to copy into the new card.
        schema:
          type: string
      responses:
        '200':
          description: Successfully created the card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: Bad request. Missing required parameters.
        '401':
          description: Unauthorized.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}:
    get:
      operationId: getCard
      summary: Get a Card
      description: Retrieves a single card by its identifier.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: fields
        in: query
        description: A comma-separated list of card fields to return.
        schema:
          type: string
          default: all
      - name: actions
        in: query
        description: A comma-separated list of action types to include.
        schema:
          type: string
      - name: attachments
        in: query
        description: Whether to include attachments.
        schema:
          type: string
          default: 'false'
      - name: members
        in: query
        description: Whether to include members.
        schema:
          type: boolean
          default: false
      - name: checkItemStates
        in: query
        description: Whether to include check item states.
        schema:
          type: boolean
          default: false
      - name: checklists
        in: query
        description: Whether to include checklists.
        schema:
          type: string
          enum:
          - all
          - none
          default: none
      responses:
        '200':
          description: Successfully retrieved the card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    put:
      operationId: updateCard
      summary: Update a Card
      description: Updates the fields of a card, including name, description, position, due date, list assignment, and more.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: name
        in: query
        description: The new name for the card.
        schema:
          type: string
          maxLength: 16384
      - name: desc
        in: query
        description: The new description for the card.
        schema:
          type: string
          maxLength: 16384
      - name: closed
        in: query
        description: Whether the card is archived.
        schema:
          type: boolean
      - name: idMembers
        in: query
        description: Comma-separated list of member IDs.
        schema:
          type: string
      - name: idLabels
        in: query
        description: Comma-separated list of label IDs.
        schema:
          type: string
      - name: idList
        in: query
        description: The ID of the list to move the card to.
        schema:
          type: string
      - name: idBoard
        in: query
        description: The ID of the board to move the card to.
        schema:
          type: string
      - name: pos
        in: query
        description: The new position of the card.
        schema:
          type: string
      - name: due
        in: query
        description: The new due date for the card.
        schema:
          type: string
          format: date-time
      - name: start
        in: query
        description: The start date for the card.
        schema:
          type: string
          format: date-time
      - name: dueComplete
        in: query
        description: Whether the due date is complete.
        schema:
          type: boolean
      - name: subscribed
        in: query
        description: Whether the authenticated member is subscribed to the card.
        schema:
          type: boolean
      - name: cover
        in: query
        description: JSON string for the card cover.
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated the card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    delete:
      operationId: deleteCard
      summary: Delete a Card
      description: Permanently deletes a card. This action cannot be undone.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully deleted the card.
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    parameters:
    - name: id
      in: path
      description: The ID of the Card
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/actions:
    get:
      operationId: getCardActions
      summary: Get Actions on a Card
      description: Retrieves a list of actions (activity events) on a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: filter
        in: query
        description: A comma-separated list of action types to filter by.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved card actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/actions/comments:
    post:
      operationId: createCardComment
      summary: Add a Comment to a Card
      description: Adds a new comment to a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: text
        in: query
        required: true
        description: The comment text.
        schema:
          type: string
          minLength: 1
          maxLength: 16384
      responses:
        '200':
          description: Successfully added the comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/attachments:
    get:
      operationId: getCardAttachments
      summary: Get Attachments on a Card
      description: Retrieves all attachments on a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: fields
        in: query
        description: A comma-separated list of attachment fields to return.
        schema:
          type: string
          default: all
      responses:
        '200':
          description: Successfully retrieved card attachments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    post:
      operationId: createCardAttachment
      summary: Create an Attachment on a Card
      description: Adds a new attachment to a card, either from a URL or a file upload.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: name
        in: query
        description: The name for the attachment.
        schema:
          type: string
      - name: mimeType
        in: query
        description: The MIME type of the attachment.
        schema:
          type: string
      - name: url
        in: query
        description: A URL to attach to the card.
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: Successfully created the attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    parameters:
    - name: id
      in: path
      description: The ID of the Card
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/checklists:
    get:
      operationId: getCardChecklists
      summary: Get Checklists on a Card
      description: Retrieves all checklists on a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully retrieved card checklists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    post:
      operationId: createCardChecklist
      summary: Create a Checklist on a Card
      description: Creates a new checklist on the specified card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: name
        in: query
        description: The name for the checklist.
        schema:
          type: string
      - name: idChecklistSource
        in: query
        description: The ID of a checklist to copy into the new checklist.
        schema:
          type: string
      - name: pos
        in: query
        description: The position of the checklist on the card.
        schema:
          type: string
          default: bottom
      responses:
        '200':
          description: Successfully created the checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/labels:
    post:
      operationId: addCardLabel
      summary: Add a Label to a Card
      description: Adds an existing label to a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: value
        in: query
        required: true
        description: The ID of the label to add.
        schema:
          type: string
      responses:
        '200':
          description: Successfully added the label.
        '401':
          description: Unauthorized.
        '404':
          description: Card or label not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/labels/{idLabel}:
    delete:
      operationId: removeCardLabel
      summary: Remove a Label from a Card
      description: Removes a label from a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: idLabel
        in: path
        required: true
        description: The ID of the label to remove.
        schema:
          type: string
      responses:
        '200':
          description: Successfully removed the label.
        '401':
          description: Unauthorized.
        '404':
          description: Card or label not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/members:
    post:
      operationId: addCardMember
      summary: Add a Member to a Card
      description: Adds a member to a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: value
        in: query
        required: true
        description: The ID of the member to add.
        schema:
          type: string
      responses:
        '200':
          description: Successfully added the member.
        '401':
          description: Unauthorized.
        '404':
          description: Card or member not found.
      security:
      - apiKey: []
        apiToken: []
    get:
      tags:
      - Cards
      summary: Get the Members of a Card
      description: Get the members on a card
      operationId: get-cards-id-members
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: id
        in: path
        description: The ID of the Card
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: fields
        in: query
        description: '`all` or a comma-separated list of member [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        required: false
        schema:
          type: string
          default: avatarHash,fullName,initials,username
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/members/{idMember}:
    delete:
      operationId: removeCardMember
      summary: Remove a Member from a Card
      description: Removes a member from a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: idMember
        in: path
        required: true
        description: The ID of the member to remove.
        schema:
          type: string
      responses:
        '200':
          description: Successfully removed the member.
        '401':
          description: Unauthorized.
        '404':
          description: Card or member not found.
      security:
      - apiKey: []
        apiToken: []
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/stickers:
    get:
      operationId: getCardStickers
      summary: Get Stickers on a Card
      description: Retrieves all stickers on a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Successfully retrieved card stickers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sticker'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    post:
      operationId: addCardSticker
      summary: Add a Sticker to a Card
      description: Adds a sticker to a card.
      tags:
      - Cards
      parameters:
      - $ref: '#/components/parameters/idParam'
      - name: image
        in: query
        required: true
        description: The sticker image identifier.
        schema:
          type: string
      - name: top
        in: query
        required: true
        description: The top position of the sticker as a percentage.
        schema:
          type: number
      - name: left
        in: query
        required: true
        description: The left position of the sticker as a percentage.
        schema:
          type: number
      - name: zIndex
        in: query
        required: true
        description: The z-index of the sticker.
        schema:
          type: integer
      - name: rotate
        in: query
        description: The rotation of the sticker in degrees.
        schema:
          type: number
          default: 0
      responses:
        '200':
          description: Successfully added the sticker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sticker'
        '401':
          description: Unauthorized.
        '404':
          description: Card not found.
      security:
      - apiKey: []
        apiToken: []
    parameters:
    - name: id
      in: path
      description: The ID of the Card
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    servers:
    - url: https://api.trello.com/1
      description: Trello API v1 Production Server
  /cards/{id}/{field}:
    get:
      tags:
      - Cards
      summary: Get a field on a Card
      description: Get a specific property of a card
      operationId: get-cards-id-field
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: id
        in: path
        description: The ID of the Card
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: field
        in: path
        description: The desired field.
        required: true
        schema:
          $ref: '#/components/schemas/CardFields'
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card_2'
    servers:
    - url: https://api.trello.com/1
  /cards/{id}/attachments/{idAttachment}:
    parameters:
    - name: id
      in: path
      description: The ID of the Card
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    - name: idAttachment
      in: path
      description: The ID of the Attachment
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Cards
      summary: Get an Attachment on a Card
      description: Get a specific Attachment on a Card.
      operationId: get-cards-id-attachments-idattachment
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: fields
        in: query
        description: The Attachment fields to be included in the response.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/AttachmentFields'
          default:
          - all
      deprecated: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/Attachment_2'
    delete:
      tags:
      - Cards
      summary: Delete an Attachment on a Card
      description: Delete an Attachment
      operationId: deleted-cards-id-attachments-idattachment
      security:
      - OAuth2:
        - write:board:trello
      parameters:
      - name: id
        in: path
        description: The ID of the Card
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: idAttachment
        in: path
        description: The ID of the attachment to delete
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /cards/{id}/board:
    get:
      tags:
      - Cards
      summary: Get the Board the Card is on
      description: Get the board a card is on
      operationId: get-cards-id-board
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: id
        in: path
        description: The ID of the Card
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: fields
        in: query
        description: '`all` or a comma-separated list of board [fields](/cloud/trello/guides/rest-api/object-definitions/#board-object)'
        required: false
        schema:
          type: string
          default: all
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /cards/{id}/checkItemStates:
    get:
      tags:
      - Cards
      summary: Get checkItems on a Card
      description: Get the completed checklist items on a card
      operationId: get-cards-id-checkitemstates
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: id
        in: path
        description: The ID of the Card
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: fields
        in: query
        description: '`all` or a comma-separated list of: `idCheckItem`, `state`'
        required: false
        schema:
          type: string
          default: all
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /cards/{id}/checkItem/{idCheckItem}:
    parameters:
    - name: id
      in: path
      description: The ID of the Card
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    - name: idCheckItem
      in: path
      description: The ID of the checkitem
      required: true
      schema:
        $ref: '#/components/schemas/TrelloID'
    get:
      tags:
      - Cards
      summary: Get checkItem on a Card
      description: Get a specific checkItem on a card
      operationId: get-cards-id-checkitem-idcheckitem
      security:
      - OAuth2:
        - read:board:trello
      parameters:
      - name: fields
        in: query
        description: '`all` or a comma-separated list of `name,nameData,pos,state,type,due,dueReminder,idMember`'
        required: false
        schema:
          type: string
          default: name,nameData,pos,state,due,dueReminder,idMember
      deprecated: false
      responses:
        '200':
          description: Success
    put:
      tags:
      - Cards
      summary: Update a checkItem on a Card
      description: Update an item in a checklist on a card.
      operationId: put-cards-id-checkitem-idcheckitem
      security:
      - OAuth2:
        - write:board:trello
      parameters:
      - name: name
        in: query
        description: The new name for the checklist item
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: 'One of: `complete`, `incomplete`'
        required: false
        schema:
          type: string
          enum:
          - complete
          - incomplete
      - name: idChecklist
        in: query
        description: The ID of the checklist this item is in
        required: false
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: pos
        in: query
        description: '`top`, `bottom`, or a positive float'
        required: false
        schema:
          $ref: '#/components/schemas/posStringOrNumber'
      - name: due
        in: query
        description: A due date for the checkitem
        required: false
        schema:
          type: string
          format: date
      - name: dueReminder
        in: query
        description: A dueReminder for the due date on the checkitem
        required: false
        schema:
          type:
          - number
          - 'null'
      - name: idMember
        in: query
        description: The ID of the member to remove from the card
        required: false
        schema:
          $ref: '#/components/schemas/TrelloID'
      deprecated: false
      responses:
        '200':
          description: Success
    delete:
      tags:
      - Cards
      summary: Delete checkItem on a Card
      description: Delete a checklist item
      operationId: delete-cards-id-checkitem-idcheckitem
      security:
      - OAuth2:
        - write:board:trello
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /cards/{id}/list:
    get:
