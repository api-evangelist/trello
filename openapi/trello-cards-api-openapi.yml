  /cards/{idCard}/customField/{idCustomField}/item:
    put:
      tags:
      - Cards
      summary: Update Custom Field item on Card
      description: Setting, updating, and removing the value for a Custom Field on a card. For more details on updating custom fields check out the Getting Started With Custom Fields
      operationId: put-cards-idcard-customfield-idcustomfield-item
      security:
      - OAuth2:
        - write:board:trello
      parameters:
      - name: idCard
        in: path
        description: ID of the card that the Custom Field value should be set/updated for
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      - name: idCustomField
        in: path
        description: ID of the Custom Field on the card.
        required: true
        schema:
          $ref: '#/components/schemas/TrelloID'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  value:
                    type: object
                    description: An object containing the key and value to set for the card's Custom Field value. The key used to set the value should match the type of Custom Field defined.
                    properties:
                      text:
                        type: string
                      checked:
                        type: boolean
                      date:
                        type: string
                        format: date-time
                        example: '2018-03-13T16:00:00.000Z'
                      number:
                        type: string
                        example: '2154'
              - type: object
                properties:
                  idValue:
                    $ref: '#/components/schemas/TrelloID'
                    description: The ID of the option for the list type Custom Field
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
  /cards/{idCard}/customFields:
    put:
      tags:
      - Cards
      summary: Update Multiple Custom Field items on Card
      description: Setting, updating, and removing the values for multiple Custom Fields on a card. For more details on updating custom fields check out the Getting Started With Custom Fields
      operationId: put-cards-idcard-customfields
      security:
      - OAuth2:
        - write:board:trello
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customFieldItems:
                  type: array
                  description: An array of objects containing the custom field ID, key and value, and ID of list type option.
                  items:
                    type: object
                    properties:
                      idCustomField:
                        pattern: ^[0-9a-fA-F]{32}$
                        example: 5abbe4b7ddc1b351ef961414
                        description: The ID of the Custom Field
                      value:
                        type: object
                        description: An object containing the key and value to set for the card's Custom Field value. The key used to set the value should match the type of Custom Field defined. This is optional if Custom Field is list type.
                        properties:
                          text:
                            type: string
                          checked:
                            type: boolean
                          date:
                            type: string
                            format: date-time
                            example: '2018-03-13T16:00:00.000Z'
                          number:
                            type: string
                            example: '2154'
                      idValue:
                        pattern: ^[0-9a-fA-F]{32}$
                        example: 5abbe4b7ddc1b351ef961414
                        description: The ID of the option for the list type Custom Field. This is optional if Custom Field is not list type.
      deprecated: false
      responses:
        '200':
          description: Success
    servers:
    - url: https://api.trello.com/1
