  pattern: '^[0-9a-fA-F]{24}$'
  prefixed: false
  note: >-
    Trello uses NO type prefix on its ids — unlike Stripe's cus_/ch_, a Trello id carries no
    indication of what kind of object it points at. An agent holding a bare id cannot tell a
    board from a card without calling the API. The one exception is Card.idShort, a
    per-board integer used in the human-facing short URL.
