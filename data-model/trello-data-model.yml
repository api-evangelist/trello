description: >-
  Entity-relationship graph for the Trello domain, derived from the id-reference fields and
  $ref links in Trello's own OpenAPI. Trello's model is a strict containment tree
  (Enterprise > Organization/Workspace > Board > List > Card > Checklist > CheckItem) with
  membership, labels, custom fields and plugins hanging off it as cross-cutting joins.
identifiers:
