polymorphic_references:
  - field: idModel
    used_by: [Webhook, CustomField, CustomFieldItems, PluginData, TokenPermission]
    note: >-
      Trello's central untyped foreign key. Because ids carry no type prefix, an idModel is
      opaque — a consumer must already know, out of band, what kind of object it points at.
      This is the single biggest machine-readability weakness in the Trello data model.
