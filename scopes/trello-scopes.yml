description: >-
  Trello OAuth 2.0 3LO scopes. OAuth 2.0 reached GA for Trello on 2026-09-15; these ten
  scopes replace the three coarse legacy Trello Auth scopes (read, write, account), which
  remain live on the 1/authorize route. Scope-to-resource mapping for the webhook surface is
  documented by Trello and recorded per scope below.
legacy_scopes:
  mechanism: Trello Auth 1/authorize route (and OAuth 1.0a)
  docs: https://developer.atlassian.com/cloud/trello/guides/rest-api/authorization/
  scopes:
  - scope: read
    description: Reading of boards, organizations and other objects on behalf of the user.
  - scope: write
    description: Writing of boards, organizations and other objects on behalf of the user.
  - scope: account
    description: >-
      Read the member email address, write member info, and mark notifications read. Member
      emails are only accessible when this scope is granted, and only for the granting user.
  expiration_options: [1hour, 1day, 30days, never]
  status: >-
    Still supported. Announced 2025-04-16 as the mechanism OAuth 2.0 would replace, but no
    removal date has been published.
