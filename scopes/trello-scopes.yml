restrictions:
  power_up_clients: >-
    Power-Up OAuth 2.0 clients are workspace-restricted. Any model they act on - including a
    webhook's idModel - must belong to a workspace the access token was authorized for, or
    the request fails with 403. OAuth 2.0 clients of non-Power-Up apps carry no such
    restriction.
  source: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
