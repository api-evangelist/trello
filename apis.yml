apis:
- aid: trello:webhooks-api
  name: Trello Webhooks API
  tags:
  - Event
  - Notification
  - Real-Time
  - Webhook
  tags_raw:
  - Events
  - Notifications
  - Real-Time
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.trello.com
  humanURL: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
  properties:
  - url: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
    type: Documentation
  - url: asyncapi/trello-webhooks-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Trello Webhooks API allows developers to receive real-time notifications when changes occur on
    Trello models such as boards, lists, and cards. Rather than polling the REST API for updates, webhooks
    push event data to a specified callback URL via HTTP POST requests containing JSON payloads. Webhook
    requests are signed with HMAC-SHA1 for verification, and webhooks are scoped to the permissions of
    the token used to create them.
