description: >-
  Trello is a web-based, kanban-style, list-making application from Atlassian that lets teams
  organize tasks, projects and workflows as boards, lists and cards. Its public REST API v1
  at https://api.trello.com/1 exposes 261 operations across boards, lists, cards, checklists,
  labels, custom fields, attachments, members, workspaces, enterprises, actions,
  notifications, search, webhooks, tokens and Power-Up plugins, with a first-party OpenAPI
  3.0.0 definition published by Atlassian. Authorization is an API key plus user token, or
  OAuth 2.0 3LO with ten granular scopes, generally available since 15 September 2026.
  Trello also ships a webhook surface signed with HMAC-SHA1, a browser client library
  (client.js), and the Power-Ups framework for extending the Trello board UI. The platform
  publishes no MCP server and no A2A agent card, no idempotency mechanism and no rate-limit
  response headers.
