apis:
- aid: trello:webhooks-api
  name: Trello Webhooks API
  tags:
  - Events
  - Notifications
  - Real-Time
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.trello.com
  humanURL: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
  properties:
  - url: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
    type: Documentation
  - url: asyncapi/trello-webhooks-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Trello Webhooks API allows developers to receive real-time notifications when changes occur on
    Trello models such as boards, lists, and cards. Rather than polling the REST API for updates, webhooks
    push event data to a specified callback URL via HTTP POST requests containing JSON payloads. Webhook
    requests are signed with HMAC-SHA1 for verification, and webhooks are scoped to the permissions of
    the token used to create them.
- aid: trello:power-ups
  name: Trello Power-Ups
  tags:
  - Customization
  - Extensions
  - Integrations
  - Plugins
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://developer.atlassian.com/cloud/trello/power-ups/
  properties:
  - url: https://developer.atlassian.com/cloud/trello/power-ups/
    type: Documentation
  description: >-
    Trello Power-Ups are a framework for extending and integrating with the Trello platform. Power-Ups
    allow developers to add custom functionality to Trello boards, including custom fields, board buttons,
    card buttons, card badges, and card detail sections. The Power-Up framework provides a client library
    with utilities and helpers for interacting with the Trello interface, managing authorization, and
    accessing the REST API from within the Power-Up context.
