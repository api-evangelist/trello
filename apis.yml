    type: APIReference
    name: Power-Up client library reference
  - url: components/trello-components.yml
    type: Components
  description: >-
    Trello Power-Ups are a framework for extending and integrating with the Trello platform. Power-Ups
    allow developers to add custom functionality to Trello boards, including custom fields, board buttons,
    card buttons, card badges, and card detail sections. The Power-Up framework provides a client library
    with utilities and helpers for interacting with the Trello interface, managing authorization, and
    accessing the REST API from within the Power-Up context.
