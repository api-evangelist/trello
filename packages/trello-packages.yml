  https://developer.atlassian.com/cloud/trello/guides/client-js/getting-started-with-client-js/
description: >-
  Client libraries for the Trello REST API. THE HEADLINE FINDING IS THE ABSENCE:
  Atlassian publishes exactly one first-party Trello client library — client.js, a
  browser-only jQuery-dependent wrapper served from the API host itself at
  https://api.trello.com/1/client.js. There is no first-party Trello SDK on npm,
  PyPI, RubyGems, NuGet, Maven Central, Packagist, crates.io or the Go module proxy.
  Every server-side language binding below is community-maintained, and most of them
  have not shipped a release since before Trello's OAuth 2.0 3LO launch (15 September
  2026) — so none of them speaks the current authorization system.
summary:
  official_count: 2
  community_count: 10
  official_registry_published: 0
  note: >-
    The single official library is CDN/host-distributed, not registry-distributed,
    and it is unversioned at its URL — a consumer cannot pin it or tell what they
    are getting.
packages:
  - name: client.js
    language: javascript
    official: true
    registry: cdn
    url: https://api.trello.com/1/client.js
    docs: https://developer.atlassian.com/cloud/trello/guides/client-js/client-js-reference/
    getting_started: https://developer.atlassian.com/cloud/trello/guides/client-js/getting-started-with-client-js/
    install: '<script src="https://api.trello.com/1/client.js?key={APIKey}"></script>'
    version: null
    published: null
    note: >-
      Checked 2026-09-17, HTTP 200, 5,891 bytes. First-party Atlassian library, but the
      distribution URL carries no version segment and no CDN metadata endpoint exists
      for it, so the version floats to whatever Trello is serving. That unpinnability
      is itself the finding: a consumer has no way to know which build they loaded.
      Requires jQuery 3.x as a peer dependency. Browser-only — there is no server-side
      first-party equivalent.
