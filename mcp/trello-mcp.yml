description: CANDIDATE tool surface derived from the official Trello REST OpenAPI. Trello ships no MCP
  server of its own. Atlassian DOES operate a remote MCP server at https://mcp.atlassian.com/v2/mcp (OAuth-gated;
  tools/list returns 401 invalid_token anonymously, WWW-Authenticate points at https://mcp.atlassian.com/.well-known/oauth-protected-resource/v2/mcp),
  but it covers Jira, Jira Service Management, Confluence, Bitbucket, Projects and Goals — NOT Trello.
  The only occurrences of "Trello" on the Atlassian Rovo MCP product page are in the site-wide product
  navigation, and the Atlassian Rovo A2A agent card at https://a2a.atlassian.com/.well-known/agent.json
  declares exactly two skills, work-in-jira and work-in-confluence, with zero Trello mentions. So there
  is no agent surface for Trello today; every tool below is a candidate this pipeline derived, not something
  a provider ships.
