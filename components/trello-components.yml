  - name: Power-Ups framework
    docs: https://developer.atlassian.com/cloud/trello/power-ups/
    description: >-
      The inverse direction — a sandboxed iframe framework that lets a third party render
      its own UI inside the Trello board: board buttons, card buttons, card badges, card
      detail sections, card back sections, custom fields and attachment sections. The
      client library brokers every interaction between the iframe and the Trello host page
      (t.get/t.set for per-scope storage, t.authorize for auth, t.popup/t.boardBar for
      chrome).
