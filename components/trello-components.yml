description: >-
  Trello's client-side surface is unusually large for a project-management API, and it is
  distinct from the REST SDK story: two loader libraries served from Atlassian CDNs, a set
  of drop-in embed components for putting live Trello objects into someone else's page, and
  a full iframe-bridge framework (Power-Ups) for putting someone else's UI into Trello.
  All of it is first-party and all of it is browser-only.
