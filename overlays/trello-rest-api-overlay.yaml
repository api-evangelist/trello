- target: $.paths['/members/{id}'].get
  description: Normalise operationId "get-members=id" to "get-members-id" - the published value contains an "="
    character, which is not a valid identifier in most generators.
  update:
    operationId: get-members-id
- target: $.paths['/boards/{id}/members/{idMember}'].delete
  description: Normalise operationId "boardsidmembersidmember" to "delete-boards-id-members-idmember" - the published
    value drops the HTTP method prefix used by every other operationId in the spec.
  update:
    operationId: delete-boards-id-members-idmember
- target: $.paths['/checklists/{id}'].put
  description: Normalise operationId "put-checlists-id" to "put-checklists-id" - the published value misspells "checklists".
  update:
    operationId: put-checklists-id
- target: $.paths['/lists/{id}/idBoard'].put
  description: Normalise operationId "put-id-idboard" to "put-lists-id-idboard" - the published value omits the
    resource name.
  update:
    operationId: put-lists-id-idboard
- target: $.paths['/enterprises/{id}/members/{idMember}/deactivated'].put
  description: Normalise operationId "enterprises-id-members-idMember-deactivated" to "put-enterprises-id-members-idmember-deactivated"
    - the published value drops the method prefix and mixes case.
  update:
    operationId: put-enterprises-id-members-idmember-deactivated
- target: $.paths['/members/{id}/avatar'].post
  description: Normalise operationId "membersidavatar" to "post-members-id-avatar" - the published value drops the
    method prefix and all separators.
  update:
    operationId: post-members-id-avatar
- target: $.paths['/organizations/{id}/members/{idMember}/all'].delete
  description: Normalise operationId "organizations-id-members-idmember-all" to "delete-organizations-id-members-idmember-all"
    - the published value drops the method prefix.
  update:
    operationId: delete-organizations-id-members-idmember-all
- target: $.paths['/customFields/{id}/options'].post
  description: 'The published spec swaps these two operationIds: the POST is labelled get-customfields-id-options
    and the GET is labelled post-customfields-id-options. Correct the POST.'
  update:
    operationId: post-customfields-id-options
- target: $.paths['/customFields/{id}/options'].get
  description: Correct the GET half of the swapped customFields options operationIds.
  update:
    operationId: get-customfields-id-options
