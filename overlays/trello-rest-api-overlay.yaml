overlay: 1.0.0
info:
  title: API Evangelist enhancements to the Trello REST API
  version: 1.0.0
  x-generated: '2026-09-17'
  x-method: generated
  x-source: openapi/trello-rest-api-openapi.json, fetched verbatim from https://developer.atlassian.com/cloud/trello/swagger.v3.json
    on 2026-09-17
  x-note: Non-destructive. This overlay records what API Evangelist would add to Trello's published contract; the
    original spec in openapi/ is never mutated. Every change below addresses a defect measured in the published
    spec, not a stylistic preference.
extends: openapi/trello-rest-api-openapi.json
actions:
- target: $.info
  description: Add the contact, terms and external documentation that the published spec omits (info carries only
    title and version).
  update:
    description: The Trello REST API v1 provides programmatic access to Trello boards, lists, cards, checklists,
      labels, custom fields, members, workspaces, enterprises, actions, notifications, search, webhooks and Power-Up
      plugins. Authorization is either a legacy API key + user token pair passed as query parameters, or OAuth 2.0
      3LO (GA 15 September 2026) with ten granular scopes. There is no idempotency mechanism and no rate-limit response
      header - see the API Evangelist conventions artifact for the runtime semantics the contract does not state.
    contact:
      name: Atlassian Developer Support
      url: https://developer.atlassian.com/support
    termsOfService: https://developer.atlassian.com/cloud/trello/developer-terms/
    license:
      name: Atlassian Cloud Terms of Service
      url: https://www.atlassian.com/legal/cloud-terms-of-service
- target: $
  description: Add externalDocs pointing at the Trello REST reference.
  update:
    externalDocs:
      description: Trello REST API documentation
      url: https://developer.atlassian.com/cloud/trello/rest/
- target: $
  description: Declare a tag set. The published spec declares NO tags and tags NO operations - all 261 are untagged,
    so every generated client lands in one flat namespace.
  update:
    tags:
    - name: Boards
      description: Operations on Trello boards.
    - name: Lists
      description: Operations on Trello lists.
    - name: Cards
      description: Operations on Trello cards.
    - name: Checklists
      description: Operations on Trello checklists.
    - name: Labels
      description: Operations on Trello labels.
    - name: Custom Fields
      description: Operations on Trello custom fields.
    - name: Members
      description: Operations on Trello members.
    - name: Organizations
      description: Operations on Trello organizations.
    - name: Enterprises
      description: Operations on Trello enterprises.
    - name: Actions
      description: Operations on Trello actions.
    - name: Notifications
      description: Operations on Trello notifications.
    - name: Search
      description: Operations on Trello search.
    - name: Webhooks
      description: Operations on Trello webhooks.
    - name: Tokens
      description: Operations on Trello tokens.
    - name: Plugins
      description: Operations on Trello plugins.
    - name: Applications
      description: Operations on Trello applications.
    - name: Emoji
      description: Operations on Trello emoji.
    - name: Batch
      description: Operations on Trello batch.
